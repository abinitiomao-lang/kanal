name: selftest
# Ручной запуск: проверяет все ключи и шлёт отчёт в Telegram. Ничего не публикует.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "keys — проверить ключи, voices — образцы голосов ElevenLabs"
        type: choice
        options: [keys, voices]
        default: keys
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KANAL_WORK: ${{ github.workspace }}/work
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python -m kanal.cli ${{ inputs.what == 'voices' && 'voices' || 'selftest' }}
