name: redo
# Ручной запуск: переделать видео заново новым подходом (старое удаляется с YouTube, снимается с плана).
on:
  workflow_dispatch:
    inputs:
      item_ids: {description: "id видео через пробел", type: string, required: true}
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  redo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python -m kanal.cli redo $ITEM_IDS
        env:
          ITEM_IDS: ${{ inputs.item_ids }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
