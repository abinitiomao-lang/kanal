name: styles
# Кадр-сравнение дизайнов шортсов (assets/short_style.yaml) → Telegram с кнопками выбора. ~$0.04.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: "сцена (пусто — нейтронная ложка)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  styles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KANAL_WORK: ${{ github.workspace }}/work
      GH_TOKEN: ${{ github.token }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python -m kanal.cli styles ${{ inputs.scene }}
      - uses: actions/upload-artifact@v4
        with:
          name: styles
          path: work/styles/
          retention-days: 7
