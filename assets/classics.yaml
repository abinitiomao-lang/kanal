# «Classics to Fall Asleep To»: дословное чтение книг в общественном достоянии (и оригинал, и английский перевод).
# Тексты скачиваются с Project Gutenberg скриптом scripts/fetch_classics.py → assets/classics/<id>.txt
# (без шапки и лицензии Gutenberg; в описании ролика — автор и переводчик, без упоминания Gutenberg).
# Части режутся автоматически по ~target_minutes длинного видео, по границам глав.

- id: siddhartha
  title: "Siddhartha"
  author: Hermann Hesse
  translator: "Gunther Olesch, Anke Dreher, Amy Coulter, Stefan Langer and Semyon Chaichenets (public domain translation)"
  year: 1922
  gutenberg: 2500
