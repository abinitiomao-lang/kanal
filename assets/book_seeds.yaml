# Идеи для тем из книг владельца (только концепции своими словами, без цитат — репо публичный).
# evidence: strong — подтверждено исследованиями; mixed — часть не воспроизвелась; weak — авторская модель/метод, не наука.
# for: long / short / both — где тема уместнее.

- book: "Thinking, Fast and Slow"
  author: Daniel Kahneman
  seeds:
    - {concept: "System 1 and System 2: the fast and the slow mind", for: both, evidence: strong}
    - {concept: "The bat-and-ball puzzle and why smart people get it wrong", for: short, evidence: strong}
    - {concept: "Anchoring: how a random number changes your estimates", for: both, evidence: strong}
    - {concept: "Availability: why vivid events feel more common than they are", for: both, evidence: strong}
    - {concept: "Loss aversion: losing hurts about twice as much as winning pleases", for: both, evidence: mixed}
    - {concept: "The Linda problem and the conjunction fallacy", for: short, evidence: strong}
    - {concept: "The planning fallacy: why projects always run late", for: both, evidence: strong}
    - {concept: "The experiencing self vs the remembering self (peak-end rule, cold-water experiment)", for: both, evidence: strong}
    - {concept: "Regression to the mean and the flight instructors who praised and punished", for: short, evidence: strong}
    - {concept: "Framing: the same choice described as lives saved or lives lost", for: both, evidence: strong}
    - {concept: "Expert intuition: when to trust a gut feeling and when not to", for: long, evidence: strong}
    - {concept: "Priming and ego depletion: famous effects that later failed to replicate", for: long, evidence: mixed}

