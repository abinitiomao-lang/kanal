# Единый дизайн ВСЕХ шортсов (выбор владельца 2026-10-28: оба формата, язык EN; формат закреплён за книгой).
# Рисовка — по референсам владельца (Шурецкая/ispiration_style_img): тату-флэш от руки, пастельные переливы.
# Шортс (10–45 с) = один самый интересный факт/идея из книги владельца (assets/book_series.yaml)
# или факт из нашего длинного видео. Можно одну короткую цитату из книги с указанием автора.
# Длинные видео сюда не относятся (config.yaml → images.style).
# Цвета — RGB hex; шрифты — файлы из assets/fonts, font_name — имя семейства для субтитров (libass).

# Одна книга — один формат: вся серия шортсов по книге выглядит одинаково.
book_formats:
  kahneman: series
  drive: series
  berne: scene                    # первый пробный «Сцена» — по Берну (2026-11-03)
  litvak: series
  flow: tale
  fisher: tale
  nvc: tale
  perry: tale
  laporte: tale
  sher: tale
rotation: [tale, series, scene]   # для фактов не из книг — по очереди

# Общая рисовка обоих форматов (дописывается к промпту формата).
art: >-
  whimsical hand-drawn tattoo flash illustration, fine black ink linework, grainy colored pencil and
  risograph texture fill, iridescent pastel palette of lilac, periwinkle blue, baby pink, mint green and
  butter yellow with small red accents, rich hatching and dense decorative ornament, folk fairytale charm,
  tiny black speckles and little yellow four-point stars scattered on a flat white paper background,
  a drawing, not a photo, one large central subject, absolutely no text, no letters, no words, no names,
  no signature, no watermark

formats:
  # A. Сказка-метафора: идея из книги прожита одним героем (референс — «ведьма и две кружки»).
  tale:
    label: "🕯 Сказка"
    layout: full                   # картинка на весь экран 9:16
    orient: portrait
    image: >-
      vertical 9:16 composition, the main subject large and in the upper two thirds
    motion: dynamic                # заметный наезд + сдвиг, без тряски (владелец: «динамичное видео»)
    animate_hook: false            # экономный режим (владелец 2026-11-03): без Kling в шортсах, ~$5/мес на fal
    whoosh: false
    voice: {stability: 0.55, similarity_boost: 0.75, style: 0.2, speed: 1.0}
    music: >-
      soft storybook lullaby: music box, celesta, warm felt piano and light strings, slow, tender, dreamy
    music_level: quiet
    subs:
      mode: word                   # по одному слову, мелко, внизу
      font_name: "Fira Sans SemiBold"
      size: 66
      color: "1C1A22"              # чернила на белой бумаге
      outline: "FFFFFF"
      y: 0.655                     # доля высоты кадра (~1258 px: выше нижней UI-зоны Shorts)
    ru_subs: &ru                   # русские субтитры поверх английских: розовый неон, минимализм
      font_name: "Fira Sans SemiBold"
      size: 52
      color: "FFFFFF"              # белый текст (владелец: розовый текст нечитаем)
      glow: "FF2BB0"               # розовая неоновая подсветка вокруг
      glow_width: 7
      blur: 6
      y: 1150                      # верх строки, px (над английскими; безопасная полоса 1050–1320)
    script: >-
      Tell this idea as a 15-40 second micro-story (40-95 words) — an allegory, not a lecture.
      The protagonist is ALWAYS our recurring hero Luna (see `hero`), living a new chapter of her life;
      other creatures of her world (a moth who collects moonlight, an old anglerfish with a lantern, a swallow,
      a fairy gardener...) may appear as side characters. Present tense, sensory,
      short sentences, gentle and a little bittersweet. The first line is an intriguing hook (a rule of this
      world or a strange habit). The idea is never named until the last two lines, which reveal it simply and
      credit the book, e.g. "Daniel Kahneman called this ... — an idea from Thinking, Fast and Slow."
      Give `character`: Luna's fixed description (copy `hero` exactly) plus this story's setting, repeated in
      every image so she looks the same in all scenes. Make it loop: the last sentence must flow
      grammatically into the first one, so the Short replays seamlessly.

    # Герой-бренд всех сказок (как в референсах): один и тот же во всех книгах.
    hero: >-
      Luna, a small periwinkle-blue cat with lilac stripes, big golden eyes, a pink crescent-moon mark on her
      forehead and a little red knitted scarf

  # B. Серия в рамке: постоянный шаблон + сюжетная рамка (референс — «Future Historians» + «День N»).
  series:
    label: "🗂 Серия"
    layout: framed                 # шапка, картинка-панель, текст под ней, подвал
    orient: landscape
    image: >-
      horizontal composition, one big subject close-up filling most of the picture, drawn as a whimsical
      character or creature rather than a plain object
    motion: dynamic
    animate_hook: false            # экономный режим (владелец 2026-11-03): без Kling в шортсах, ~$5/мес на fal
    whoosh: false
    voice: {stability: 0.45, similarity_boost: 0.75, style: 0.3, speed: 1.0}
    music: >-
      witty documentary underscore: pizzicato strings, marimba, light clarinet, curious and playful, mid tempo
    music_level: soft
    frame:
      bg: "FBF7EF"                 # бумага
      line: "1C1A22"               # чернильные линии вокруг панели
      kicker: "D9468F"             # маленькая надпись над заголовком
      title: "1C1A22"
      footer: "6E6878"
      stars: "F2C230"              # точки и звёздочки по бумаге, как в референсах
      panel: {y: 470, h: 720}      # панель 1080×720; всё важное выше нижней UI-зоны Shorts (~1320 px)
    subs:
      mode: phrase                 # фраза целиком под панелью
      font_name: "Fira Sans SemiBold"
      size: 58
      color: "1C1A22"
      outline: "FBF7EF"
      y: 1262                      # верх блока субтитров, px
    ru_subs:
      <<: *ru
      y: 1205
    script: >-
      Frame this idea with a playful narrative device and keep it for the whole Short: e.g. a documentary
      from the year 2126 where historians study our strange habits, an alien anthropologist's field notes,
      a museum label from the future, a nature documentary about humans. Dry, witty, precise documentary
      tone, 40-95 words (15-40 seconds), short sentences, concrete everyday examples the viewer recognises
      in themselves.
      Cold open on the habit itself (first 1.5 s), then the 2126 framing. The second-to-last line credits
      the book and author naturally; the last line ("...and historians are still confused") loops back to
      the opening. Give `kicker` (max 5 words, e.g. "A DOCUMENTARY
      FROM THE YEAR 2126") and `header_title` (max 8 words, the hook, e.g. "Historians are confused by
      this 2020s habit").

  # C. Сцена: эмоциональный диалог как кадр из фильма (референс — эдит «Элегия Хиллбилли»):
  # крупные планы лиц, 2–3 голоса, неоновые субтитры по 1–2 слова, цвет по говорящему.
  scene:
    label: "🎭 Сцена"
    layout: full
    orient: portrait
    art: >-
      cinematic film still from a 2000s family drama, photorealistic, 35mm film grain, shallow depth of field,
      warm tungsten practical lights, emotional close-up of a face filling the frame, natural skin texture,
      real home interior softly blurred behind, absolutely no text, no letters, no captions, no watermark
    image: >-
      vertical 9:16 close-up, the face in the upper two thirds of the frame
    motion: dynamic
    animate_hook: false            # экономный режим (владелец 2026-11-03): без Kling в шортсах, ~$5/мес на fal
    whoosh: false
    dialogue: true
    music: >-
      emotional cinematic film score: sparse piano, low cello swells, intimate and tense, slow
    music_level: quiet
    music_offset_db: -2            # под диалогом музыка тише
    voice: {stability: 0.3, similarity_boost: 0.75, style: 0.6, speed: 1.0}
    host_voice: {stability: 0.5, similarity_boost: 0.75, style: 0.25, speed: 1.0}
    voices:                        # стандартные голоса ElevenLabs (проверены в selftest voices)
      woman: "cgSgspJ2msm6clMCkdW9"      # Jessica
      girl: "FGY2WhTYpPnrIDTdsKH5"       # Laura
      man: "nPczCjzI2devNBz1zQrb"        # Brian
      boy: "TX3LPaxmHKxFdv7VOQHJ"        # Liam
      older_man: "iP95p4xoKVk53GoZ742B"  # Chris
    subs:
      mode: neon                   # 1–2 слова КАПСОМ, цвет по говорящему, неоновое свечение
      font_name: "Anton"
      size: 108
      colors: ["7CFF4F", "FFE23D", "FF5A3D", "6FE3FF"]   # роли A, B, C…; ведущий — host_color
      host_color: "FFFFFF"
      glow_width: 9
      blur: 9
      y: 0.645
    ru_subs:
      <<: *ru
      y: 985                       # над неоном, не перекрывает две строки
    script: >-
      Dramatise the idea as a tense, emotional scene between 2 (at most 3) people — like a moment cut from a
      family drama film: a mother and her teenage son, a couple, a boss and an employee, two sisters. 4-7 short
      spoken lines in natural everyday English (sarcasm, interrupting, raw feeling; mild language only), 10-60
      words of dialogue in total, so the viewer instantly recognises the situation from their own life. The
      characters never explain the psychology. Then the HOST adds 1-2 calm lines that name the idea and credit
      the author and book (e.g. "That's the game Eric Berne called 'Why Don't You — Yes, But'."). Fill `cast`
      (role ids A, B, C with name, a fixed photographic look — age, hair, clothes, setting — and voice) and
      `lines` (role A/B/C/HOST, text, emotion). `narration` = all line texts joined in order. Write exactly one
      scene per non-host line, its `words` = that line's text, its `visual` = an emotional close-up of the
      speaking character (repeat their full look) reacting with that emotion; for the HOST lines use one quiet
      final shot of both characters apart in the same room.
