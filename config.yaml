# Все секреты — только в GitHub Secrets / env. Здесь только несекретные настройки.

channel:
  id: "UCrfBMpzLf5jPt06IBmaGoZA"  # https://www.youtube.com/@SashaMao-e8i — загрузки только сюда
  name: "Night Nerd Radio"        # бренд (2026-11-03); в Studio канал переименовывается вручную
  greeting: "Good evening, nerds. Lights down, voices low. This is Night Nerd Radio."
  # «О канале» — ставится в YouTube командой `python -m kanal.cli channel-sync` (workflow yt-status, аргумент channel-sync)
  about: |-
    Welcome to NightNerd Radio 🌌

    Psychology, science and the ideas of great books, told in a calm, low voice to help you unwind and fall asleep.

    🌙 Long episodes (2–3 hours): gentle book summaries and science to fall asleep to. The screen dims after 15 minutes.
    ⚡ Shorts: one surprising idea from psychology in under a minute.

    New videos in the evening, 9 PM New York time. Rest easy. You're in the right place. ✨

    Narration uses an AI voice; visuals are AI-generated illustrations and royalty-free stock.
  keywords: ["sleep", "fall asleep", "sleep learning", "psychology", "book summary", "science to fall asleep to",
             "bedtime stories for adults", "calm narration", "relaxing", "insomnia", "self help"]
  name_candidates:
    - "Night Nerd Radio"
    - "Sleepy Science"
    - "Drift & Learn"
    - "The Quiet Classroom"
    - "Slow Facts for Sleep"
    - "Midnight Lessons"
  language: en
  category_id: "27"               # Education
  made_for_kids: false
  synthetic_media: true           # отметка «altered or synthetic content»

# До прохождения аудита YouTube API все загрузки залочены как private.
# true  => «Опубликовать» = бот отдаёт файл + метаданные для ручной загрузки в Studio.
# false => «Опубликовать» = videos.update privacyStatus=public.
pre_audit_mode: false

subjects: [physics, chemistry, biology, history, geography, astronomy, earth science, human body, ancient civilizations, oceans, psychology]

models:
  writer: claude-haiku-5-5        # сценарии
  checker: claude-sonnet-5-5      # фактчек (второй проход)
  screenwriter: claude-sonnet-5-5  # редакция шортсов и русские субтитры (2026-11-04: Haiku писал слабо)
  writer_effort: medium
  checker_effort: medium
  screenwriter_effort: high

budget:
  monthly_usd: 50
  warn_at: 0.8                    # предупреждение в бот при 80%
  fixed_monthly:                  # подписки, учитываются целиком
    elevenlabs_creator: 22

long:
  every_days: 3
  target_minutes: 165             # с запасом: LLM часто пишет короче просимого
  chapters: 12
  words_per_minute: 140           # замерено: Kokoro af_heart, speed 0.85, с паузами
  render_groups: 6                # параллельные job'ы озвучки (Kokoro)
  fps: 24
  width: 1920
  height: 1080
  video_bitrate: "1100k"          # 3 ч ≈ 1.9 ГБ — влезает в лимит 2 ГБ релиза для ручной загрузки
  audio_bitrate: "128k"
  kokoro_voices: ["af_nicole", "am_michael"]   # 2026-11-10 выбор владельца: чередуются по видео (было af_heart)
  kokoro_speed: 0.85
  ambient_db: -30                 # запасной генерируемый эмбиент, если музыка не сгенерировалась
  music_db: -24                   # фоновая музыка под голосом (2026-11-10: тише и легче, было −21)
  music_tracks: 2                 # треков на видео, чередуются
  music_seconds: 180              # ~900 кредитов ElevenLabs за минуту → 2×3 мин ≈ 5400 кредитов
  music_style: >-
    light, airy sleep music in 432 Hz tuning, very slow, around 50 BPM. Soft floating pads like a warm breeze,
    a few gentle wind chimes and a quiet crystal singing bowl now and then, sparse soft piano or harp notes with
    long silences between them. No drums, no beat, no bass pulse. Delicate, weightless, spacious reverb,
    no vocals, no sudden loud changes
  fade_out_seconds: 30
  dim_after_minutes: 15           # «Dark Screen»: картинка плавно гаснет, чтобы не светить в спальне
  dim_fade_seconds: 60
  dim_brightness: -0.22           # eq brightness итоговой тёмной петли (почти чёрный, слабое свечение)
  dim_saturation: 0.6

shorts:
  publish_hour_ny: 21             # подсказка «Запланировать» в боте: 21:00 по Нью-Йорку, время отхода ко сну
  per_day: 2                      # 1–2 в день стабильно (против «mass-produced»; хватает на Kling-хук)
  max_uploads_24h: 3              # своих загрузок на YouTube за 24 ч; лишние ждут в черновике релиза (бот догрузит)
  min_seconds: 10
  max_seconds: 45               # владелец: шортсы 10–45 с
  fps: 30
  width: 1080
  height: 1920
  eleven_model: eleven_multilingual_v2   # 2026-11-04: живее и чище Flash (×2 кредита, шортсы короткие)
  eleven_voice_id: "cjVigY5qzO86Huf0OWal"   # Eric — выбран владельцем 2026-10-28
  images_per_short: 8
  music:                          # своя музыка ElevenLabs под каждый шортс (настроение и уровень — от сценариста)
    enabled: true
    levels: {quiet: -29, soft: -25, present: -20}   # дБ до дакинга; под голосом ещё −4…6 дБ
  use_pexels: true                # только если задан PEXELS_API_KEY

# Длинное: ОДНА картинка на всё видео + 10-секундная бесшовная анимация (старт = финиш), повторяется.
animation:
  model: "fal-ai/kling-video/v3/pro/image-to-video"
  seconds: 10
  usd_per_second: 0.112           # без звука, fal.ai 2026-10
  hero_model: "fal-ai/flux/dev"   # главная картинка — моделью получше
  hero_usd: 0.05

images:
  model: "fal-ai/flux/schnell"
  usd_per_image: 0.006            # ~2 MP при $0.003/MP
  style: >-
    soft painterly digital illustration, dark navy blue and warm amber palette,
    gentle glow, calm, dreamy, cinematic lighting, no text, no letters, no watermark

bot:
  poll_seconds: 480               # сколько job бота слушает Telegram за один запуск (будит wake/)

# Автопилот (2026-11-10): если владелец молчит — тема берётся сама, готовое видео уходит в план на 21:00 NY
# с кнопкой «Снять и удалить». Отключить: enabled: false.
autopilot:
  enabled: true
  pick_after_hours: 24            # предложение тем без выбора → берём лучшие (шортсы: Берн и scene вперёд)
  approve_after_hours: 24         # видео ждёт апрува → в план

# Плейлисты канала: бот после публикаций (и `python -m kanal.cli yt-status playlists-sync`) создаёт
# недостающие (по точному названию — существующие, в т.ч. созданные владельцем в Studio, переиспользуются)
# и раскладывает опубликованные видео. kind: short/long; books — id из book_series.yaml.
# Плюс автоматически — плейлист на каждую серию длинных видео, когда вышла 2-я часть.
# Пустые плейлисты YouTube не показывает на странице канала — это не баг.
playlists:
  - title: "Science to Fall Asleep To"          # создан владельцем 2026-11-03
    description: "Calm, low-voice retellings of the key ideas of great psychology and science books. Dim screen, gentle music. Press play and drift off."
    kind: long
    exclude_series_prefix: "classic:"
  - title: "Shorts: Psychology"                 # создан владельцем 2026-11-03
    description: "One surprising idea from psychology and great books — in under a minute."
    kind: short
  - title: "Classic Stories Read Aloud — Fall Asleep to Literature"
    description: "Public-domain classics read unabridged in a calm voice, to help you unwind and fall asleep."
    kind: long
    series_prefix: "classic:"
